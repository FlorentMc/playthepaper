name: playthepaper
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  collection: ^1.19.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.5.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  http: ^1.6.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.29.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/content/editions/
    - assets/content/puzzles/
    - assets/dictionaries/
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3.ttf
