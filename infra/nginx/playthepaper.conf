# Play the Paper: HTTPS server for playthepaper.com (www redirects to the apex).
#
# Serves two static trees, nothing else:
#   /            -> /var/www/playthepaper/app          (Flutter web build, branch `build`)
#   /content/    -> /var/www/playthepaper/src/content  (published content, branch `live`)
# Both are git checkouts refreshed every 5 minutes by playthepaper-pull.timer.
# There is no build step and no application server on this box.
#
# Install (done by infra/deploy/setup-droplet.sh, only once the certificate exists):
#   install -m 644 playthepaper.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/playthepaper.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx        # nginx -t must pass before any reload
#
# Certificate paths below are exactly what this command creates
# (lineage name = first -d domain):
#   certbot certonly --nginx -d playthepaper.com -d www.playthepaper.com \
#       --deploy-hook 'systemctl reload nginx'
# Until those files exist this file must NOT be enabled: nginx -t fails on a
# missing certificate and the whole nginx instance (including commuteglance)
# would refuse to reload. playthepaper-http.conf carries the port-80 block.
#
# Edition boundary: edition dates roll at 04:00 UTC. The file
# /content/editions/<date>.json for edition date D opens at 04:00 UTC on D and
# is rewritten once (evergreen -> news) shortly before that, hence the short
# max-age on editions/ and index.json. Puzzle files are immutable by id, hence
# the one-year immutable cache on puzzles/.
#
# App cache policy: Flutter's web output is NOT content-hashed (main.dart.js,
# flutter_bootstrap.js, canvaskit/*, assets/* keep stable names) and, as of
# Flutter 3.41, flutter_service_worker.js is a stub that unregisters itself, so
# the browser HTTP cache is the only cache. Every app file is therefore served
# `no-cache` (revalidate with ETag/Last-Modified; unchanged files cost a 304),
# which guarantees a new build is picked up on the next load.
#
# No `server_name _` and no `default_server`: the existing commuteglance site
# is the default server on this box and must stay that way.
# No IPv6 listeners: DNS has an A record only (see infra/README.md).

# Cache-Control by request path. Declared once here (this file is included in
# the http context) so a single add_header at server level covers every
# location; add_header inside a location would drop the inherited headers.
map $uri $playthepaper_cache_control {
    default                 "no-cache";
    ~^/content/puzzles/     "public, max-age=31536000, immutable";
    ~^/content/             "public, max-age=60, must-revalidate";
}

# www -> apex
server {
    listen 443 ssl http2;
    server_name www.playthepaper.com;

    ssl_certificate     /etc/letsencrypt/live/playthepaper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playthepaper.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://playthepaper.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name playthepaper.com;

    ssl_certificate     /etc/letsencrypt/live/playthepaper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playthepaper.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:playthepaper_ssl:5m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/playthepaper.access.log;
    error_log  /var/log/nginx/playthepaper.error.log;

    root  /var/www/playthepaper/app;
    index index.html;

    # Headers for every response (including 404s and the SPA fallback).
    add_header Cache-Control $playthepaper_cache_control always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # No Content-Security-Policy: Flutter web needs wasm/blob/inline allowances
    # that change between releases. Add one only after testing a real build.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/javascript text/css
               application/wasm application/manifest+json image/svg+xml font/ttf;

    # Both checkouts contain a .git directory. Never serve dotfiles.
    # (Exact-match ACME locations added by certbot still win over this regex.)
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # --- Content tree (served straight from the `live` checkout) -----------

    # Immutable puzzle files: a correction is a new id, never an overwrite.
    location ^~ /content/puzzles/ {
        alias /var/www/playthepaper/src/content/puzzles/;
    }

    # Run reports are for the operator (repo only), not for the site.
    location ^~ /content/reports/ {
        return 404;
    }

    # index.json and editions/<date>.json (max-age=60 via the map above).
    location ^~ /content/ {
        alias /var/www/playthepaper/src/content/;
    }

    # --- Flutter web app ---------------------------------------------------

    # Share links: /p/<puzzle id>. tool/build_content.dart writes one static
    # page per puzzle under content/share/<id>.html (the app shell with
    # puzzle-specific title and Open Graph tags, so messaging apps preview
    # "Play the Paper Mini Crossword · 8 September 2026"). A human who taps the
    # link still gets the app, booted at /p/<id>. Unknown ids fall back to
    # the plain shell and the app shows its own not-found state.
    location ~ ^/p/(?<playthepaper_share_id>[A-Za-z0-9-]+)$ {
        root /var/www/playthepaper/src/content/share;
        try_files /$playthepaper_share_id.html @playthepaper_app;
    }

    location @playthepaper_app {
        root /var/www/playthepaper/app;
        try_files /index.html =404;
    }

    # Entry points and everything else in the app tree: no-cache (see header).
    # Any other client route (/e/<date>, /news/<date>, ...) loads index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
