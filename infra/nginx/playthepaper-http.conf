# Play the Paper: plain-HTTP server for playthepaper.com / www.playthepaper.com.
#
# This file is always enabled, even before a certificate exists, because
# certbot's HTTP-01 challenge needs a port-80 server block for the domain.
# Everything else on port 80 redirects to https://playthepaper.com.
#
# Install (done by infra/deploy/setup-droplet.sh):
#   install -m 644 playthepaper-http.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/playthepaper-http.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx        # nginx -t must pass before any reload
#
# Certificate (run once DNS for playthepaper.com and www points at 142.93.63.8):
#   certbot certonly --nginx -d playthepaper.com -d www.playthepaper.com \
#       --deploy-hook 'systemctl reload nginx'
# `certonly` obtains the certificate and configures renewal without letting
# certbot rewrite the hand-written server blocks. The nginx authenticator
# inserts a temporary `location = /.well-known/acme-challenge/<token>` into
# this block; an exact-match location wins over `location /`, so the redirect
# below does not interfere. The deploy hook reloads nginx after each renewal
# so the new certificate is actually served.
#
# No `server_name _` and no `default_server`: the existing commuteglance site
# is the default server on this box and must stay that way.

server {
    listen 80;
    server_name playthepaper.com www.playthepaper.com;

    access_log /var/log/nginx/playthepaper.access.log;
    error_log  /var/log/nginx/playthepaper.error.log;

    # Redirect lives in a location, not at server level, so an exact-match
    # ACME location inserted by certbot is still reachable.
    location / {
        return 301 https://playthepaper.com$request_uri;
    }
}
